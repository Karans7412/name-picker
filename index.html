<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="googlebot" content="noindex, nofollow">
<title>🎱 Name Picker</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; overflow:hidden; font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif; }
  body {
    background:linear-gradient(160deg,#ffe6f0 0%,#e6f3ff 50%,#fff5e0 100%);
    color:#333; touch-action:manipulation;
  }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .hidden { display:none !important; }

  /* ===== 설정 화면 ===== */
  #setup { padding:18px 16px; overflow-y:auto; align-items:center; }
  .title { font-size:30px; font-weight:900; color:#ff5fa2; text-shadow:2px 2px 0 #fff; margin:6px 0 2px; }
  .subtitle { font-size:14px; color:#888; margin-bottom:12px; }
  .card { width:100%; max-width:560px; background:#fff; border-radius:22px; padding:16px; box-shadow:0 8px 24px rgba(0,0,0,.08); margin-bottom:14px; }
  .card h2 { font-size:17px; color:#5b6cff; margin-bottom:10px; display:flex; align-items:center; gap:6px; }
  .add-row { display:flex; gap:8px; }
  .add-row input {
    flex:1; font-size:19px; padding:13px 14px; border:2px solid #ffd1e3; border-radius:14px; outline:none;
  }
  .add-row input:focus { border-color:#ff5fa2; }
  .btn {
    border:none; border-radius:14px; font-weight:800; cursor:pointer; transition:transform .08s, filter .15s;
    font-family:inherit;
  }
  .btn:active { transform:scale(.94); }
  .add-btn { background:#5b6cff; color:#fff; font-size:18px; padding:13px 20px; }
  .name-list { list-style:none; margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .name-item {
    display:flex; align-items:center; gap:8px; background:#f7f8ff; border-radius:14px; padding:8px 10px;
  }
  .name-color { width:26px; height:26px; border-radius:50%; flex:none; box-shadow:inset 0 -3px 4px rgba(0,0,0,.15); }
  .name-text { flex:1; font-size:18px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tag-btn {
    border:none; border-radius:11px; padding:8px 10px; font-size:13px; font-weight:800; cursor:pointer; font-family:inherit;
    background:#e9ecf5; color:#999; min-width:104px; white-space:nowrap;
  }
  .tag-btn.on-star { background:#ffd54a; color:#7a5a00; }
  .tag-btn.on-ban  { background:#9aa0aa; color:#fff; }
  .del-btn { background:#ffe0e0; color:#ff5a5a; font-size:18px; padding:8px 12px; border:none; border-radius:11px; cursor:pointer; }
  .hint { font-size:12.5px; color:#aaa; margin-top:10px; line-height:1.6; }
  /* 반 버튼(칩) — 저장된 반이 전부 위에 보이고, 누르면 그 반으로 전환 */
  #classChips { display:flex; flex-wrap:wrap; gap:9px; margin-bottom:12px; }
  .cls-chip {
    font-family:inherit; font-weight:800; font-size:18px;
    padding:12px 20px; border-radius:999px; cursor:pointer;
    background:#fff; color:#555; border:2px solid #ffd1e3;
    -webkit-tap-highlight-color:transparent;
  }
  .cls-chip.on { background:#ff5fa2; color:#fff; border-color:#ff5fa2; }
  .start-btn {
    width:100%; max-width:560px; background:linear-gradient(135deg,#ff8a5f,#ff5fa2); color:#fff;
    font-size:24px; padding:18px; border-radius:20px; margin-bottom:24px; box-shadow:0 6px 18px rgba(255,95,162,.4);
  }
  .start-btn:disabled { filter:grayscale(.7); opacity:.5; }
  .count-badge { font-size:13px; color:#fff; background:#5b6cff; border-radius:20px; padding:2px 10px; font-weight:700; }

  /* ===== 추첨 화면 ===== */
  #game { background:radial-gradient(circle at 50% 30%,#fff 0%,#f0f4ff 100%); }
  .top-bar { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; }
  .top-bar .game-title { font-size:20px; font-weight:900; color:#5b6cff; }
  .small-btn { background:#fff; border:2px solid #ddd; color:#666; font-size:14px; padding:8px 14px; border-radius:12px; }
  #stage { flex:1; position:relative; }
  #machine { display:block; width:100%; height:100%; }
  #logo {
    position:absolute; top:6px; left:50%; transform:translateX(-50%);
    width:200px; max-width:52%; height:auto; z-index:5; pointer-events:none;
    filter:drop-shadow(0 3px 6px rgba(0,0,0,.18));
  }
  /* 아래에서 걸어다니는 곰 */
  .bear-walk {
    --bw:clamp(120px, 30vmin, 210px);
    position:absolute; bottom:8px; left:0; width:var(--bw); z-index:10; pointer-events:none;
    animation:bwalk 8s linear infinite;
  }
  .bear-face { animation:bface 8s linear infinite; }
  .bear-bob  { display:block; width:100%; height:auto; animation:bbob .42s ease-in-out infinite;
               filter:drop-shadow(0 3px 4px rgba(0,0,0,.2)); }
  @keyframes bwalk { 0%{left:0;} 50%{left:calc(100% - var(--bw));} 100%{left:0;} }
  @keyframes bface { 0%,49.9%{transform:scaleX(-1);} 50%,100%{transform:scaleX(1);} }
  @keyframes bbob  { 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-7px) rotate(4deg);} }
  /* PICK 옆 GOOD 로고 */
  #goodLogo { height:46px; width:auto; align-self:center; pointer-events:none;
              filter:drop-shadow(0 2px 4px rgba(0,0,0,.15)); }
  .winner {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none; opacity:0; transition:opacity .25s;
  }
  .winner.show { opacity:1; }
  .winner-label { font-size:20px; color:#ff5fa2; font-weight:800; margin-bottom:8px; }
  .winner-name {
    font-size:64px; font-weight:900; color:#fff; padding:18px 44px; border-radius:30px;
    background:linear-gradient(135deg,#ff8a5f,#ff5fa2); box-shadow:0 10px 30px rgba(0,0,0,.25);
    animation:pop .5s cubic-bezier(.2,1.4,.4,1); max-width:90vw; text-align:center; word-break:keep-all;
  }
  @keyframes pop { 0%{transform:scale(0) rotate(-12deg);} 100%{transform:scale(1) rotate(0);} }
  .bottom-bar { padding:14px 16px 22px; display:flex; gap:12px; }
  .draw-btn {
    flex:1; background:linear-gradient(135deg,#5b6cff,#8a5fff); color:#fff; font-size:26px; padding:20px;
    border-radius:22px; box-shadow:0 6px 18px rgba(91,108,255,.4);
  }
  .draw-btn:disabled { filter:grayscale(.6); opacity:.55; }
  .remain { text-align:center; font-size:13px; color:#999; padding-bottom:6px; }
  .confetti { position:absolute; width:12px; height:12px; pointer-events:none; }

  /* ===== 앱 내 입력창 (prompt/confirm 대체 — 태블릿 홈화면 앱에서도 동작) ===== */
  #modal {
    position:fixed; inset:0; z-index:9000; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.35);
  }
  .modal-card {
    background:#fff; border-radius:20px; padding:22px 20px; width:86%; max-width:340px;
    box-shadow:0 10px 30px rgba(0,0,0,.2);
  }
  .modal-title { font-size:18px; font-weight:800; color:#5b6cff; margin-bottom:14px; text-align:center; }
  #modalInput {
    width:100%; font-size:20px; padding:12px 14px; border:2px solid #ffd1e3; border-radius:14px; outline:none;
  }
  #modalInput:focus { border-color:#ff5fa2; }
  .modal-btns { display:flex; gap:10px; margin-top:16px; }
  .modal-btns .btn { flex:1; font-size:17px; padding:13px; }
  #modalCancel { background:#f1f3f9; color:#666; }
  #modalOk { background:linear-gradient(135deg,#ff8a5f,#ff5fa2); color:#fff; }
  #toast {
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%); z-index:9500;
    background:rgba(50,50,60,.92); color:#fff; font-size:15px; font-weight:700;
    padding:12px 20px; border-radius:14px; pointer-events:none; opacity:0; transition:opacity .25s;
    max-width:86vw; text-align:center;
  }
  #toast.show { opacity:1; }

  /* ===== 비밀번호 잠금 ===== */
  #lock {
    position:fixed; inset:0; z-index:9999; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:linear-gradient(160deg,#ffe6f0 0%,#e6f3ff 50%,#fff5e0 100%);
  }
  .lock-card {
    background:#fff; border-radius:24px; padding:28px 24px; text-align:center;
    width:86%; max-width:340px; box-shadow:0 10px 30px rgba(0,0,0,.12);
  }
  .lock-card img { width:118px; height:auto; margin-bottom:8px; }
  .lock-title { font-size:20px; font-weight:800; color:#5b6cff; margin-bottom:16px; }
  #pw {
    width:100%; font-size:26px; text-align:center; letter-spacing:6px;
    padding:14px; border:2px solid #ffd1e3; border-radius:14px; outline:none;
  }
  #pw:focus { border-color:#ff5fa2; }
  #pwBtn {
    margin-top:14px; width:100%; background:linear-gradient(135deg,#ff8a5f,#ff5fa2);
    color:#fff; font-size:20px; padding:14px; border:none; border-radius:16px; font-weight:800; cursor:pointer;
  }
  #pwMsg { margin-top:10px; font-size:14px; color:#ff5a5a; min-height:18px; font-weight:700; }
  .shake { animation:shk .4s; }
  @keyframes shk { 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }
</style>
</head>

<script>
"use strict";

// ===== 비밀번호 잠금 (해시 비교, 평문 비번은 코드에 없음) =====
var PW_HASH="07408b004e169bf3b2423e4484b40645bbc769ce508ba7c4efad0f156d46d117";
var lockEl=document.getElementById("lock");
var pwEl=document.getElementById("pw");
var pwBtnEl=document.getElementById("pwBtn");
var pwMsgEl=document.getElementById("pwMsg");
var lockCardEl=document.getElementById("lockCard");
function sha256hex(s){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function(buf){
    return Array.prototype.map.call(new Uint8Array(buf), function(b){ return ("0"+b.toString(16)).slice(-2); }).join("");
  });
}
function unlockApp(){ lockEl.style.display="none"; try{ sessionStorage.setItem("np_ok","1"); }catch(e){} }
function checkPw(){
  sha256hex(pwEl.value).then(function(h){
    if(h===PW_HASH){ unlockApp(); }
    else {
      pwMsgEl.textContent="Wrong password";
      lockCardEl.classList.remove("shake"); void lockCardEl.offsetWidth; lockCardEl.classList.add("shake");
      pwEl.value=""; pwEl.focus();
    }
  }).catch(function(){ pwMsgEl.textContent="This browser can't check the password."; });
}
pwBtnEl.onclick=checkPw;
pwEl.addEventListener("keydown",function(e){ if(e.key==="Enter") checkPw(); });
try{ if(sessionStorage.getItem("np_ok")==="1") lockEl.style.display="none"; else pwEl.focus(); }catch(e){ pwEl.focus(); }

// ===== 소리 (브라우저 내장 합성음, 설치/파일 불필요) =====
var SOUND_KEY="prep_namepicker_sound";
var AC=null, masterGain=null, lastClick=0;
var soundOn=(function(){ try{ return localStorage.getItem(SOUND_KEY)!=="off"; }catch(e){ return true; } })();
function audioInit(){
  if(AC) { if(AC.state==="suspended" && soundOn) AC.resume(); return; }
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=AC.createGain();
    masterGain.gain.value = soundOn ? 1 : 0;
    masterGain.connect(AC.destination);
  }catch(e){ AC=null; masterGain=null; }
}
// 켜기/끄기를 확실하게: 플래그 + 마스터 볼륨 0 + 오디오 엔진 정지 (3중)
function applySound(){
  try{
    if(masterGain) masterGain.gain.value = soundOn ? 1 : 0;
    if(AC){ if(soundOn){ if(AC.state==="suspended") AC.resume(); } else { AC.suspend(); } }
  }catch(e){}
}
function tone(freq,dur,type,vol,slideTo){
  if(!AC||!soundOn) return;
  var t=AC.currentTime;
  var o=AC.createOscillator(), g=AC.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(masterGain||AC.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function sfxClick(){ // 공이 벽에 부딪히는 톡 소리 (너무 잦지 않게)
  if(!AC||!soundOn) return;
  var now=AC.currentTime;
  if(now-lastClick<0.045) return; lastClick=now;
  tone(180+Math.random()*180, 0.06, "triangle", 0.12);
}
function sfxLaunch(){ tone(300,0.35,"sawtooth",0.18,1100); } // 슝 상승
function sfxWin(){ // 띠-리-링 팡파레
  if(!AC||!soundOn) return;
  var notes=[523,659,784,1047], t0=AC.currentTime;
  notes.forEach(function(f,i){
    var t=t0+i*0.11, o=AC.createOscillator(), g=AC.createGain();
    o.type="square"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.22,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.32);
    o.connect(g); g.connect(masterGain||AC.destination); o.start(t); o.stop(t+0.34);
  });
}

// 공 색상 팔레트 (최대 9개)
var PALETTE = ["#ff6b8a","#5b9bff","#ffb74a","#5fd0a0","#b07cff","#ff8a5f","#4ec3e0","#ff5fa2","#8ac94a"];

// ===== 앱 내 입력창/확인창 (prompt·confirm은 태블릿 홈화면 앱에서 안 떠서 대체) =====
var modalEl=document.getElementById("modal");
var modalTitleEl=document.getElementById("modalTitle");
var modalInputEl=document.getElementById("modalInput");
var modalOkEl=document.getElementById("modalOk");
var modalCancelEl=document.getElementById("modalCancel");
var modalCb=null;
function askText(title, def, cb){
  modalTitleEl.textContent=title;
  modalInputEl.style.display="";
  modalInputEl.value=def||"";
  modalCb=cb;
  modalEl.classList.remove("hidden");
  setTimeout(function(){ try{ modalInputEl.focus(); modalInputEl.select(); }catch(e){} },50);
}
function askConfirm(title, cb){
  modalTitleEl.textContent=title;
  modalInputEl.style.display="none";
  modalCb=cb;
  modalEl.classList.remove("hidden");
}
function closeModal(){ modalEl.classList.add("hidden"); modalCb=null; }
modalOkEl.onclick=function(){
  var cb=modalCb, v=modalInputEl.style.display==="none" ? true : modalInputEl.value;
  closeModal();
  if(cb) cb(v);
};
modalCancelEl.onclick=closeModal;
modalInputEl.addEventListener("keydown",function(e){ if(e.key==="Enter") modalOkEl.onclick(); });

var toastEl=document.getElementById("toast"), toastT=null;
function toast(msg){
  toastEl.textContent=msg;
  toastEl.classList.add("show");
  clearTimeout(toastT);
  toastT=setTimeout(function(){ toastEl.classList.remove("show"); },1800);
}

// ===== 반별 저장 =====
var KEY = "prep_namepicker_v2";
var DB = loadDB();
function loadDB(){
  try{
    var o = JSON.parse(localStorage.getItem(KEY) || "null");
    if(o && o.classes && o.classes.length) return o;
  }catch(e){}
  return { classes:[{ id:newId(), name:"Class 1", people:[] }], curId:null };
}
function newId(){ return "c" + Math.random().toString(36).slice(2,9); }
if(!DB.curId || !DB.classes.some(function(c){ return c.id===DB.curId; })) DB.curId = DB.classes[0].id;
function cls(){ return DB.classes.find(function(c){ return c.id===DB.curId; }) || DB.classes[0]; }

var savedMsgEl = null, savedT = null;
function saveDB(){
  try{
    localStorage.setItem(KEY, JSON.stringify(DB));
    if(savedMsgEl){
      savedMsgEl.textContent = "Saved!";
      clearTimeout(savedT);
      savedT = setTimeout(function(){ savedMsgEl.textContent = "Names are saved automatically"; }, 1100);
    }
  }catch(e){
    if(savedMsgEl) savedMsgEl.textContent = "Cannot save. Please check browser settings.";
  }
}

// 상태 — people 은 현재 반의 명단 배열을 그대로 가리킨다(넣고 빼면 바로 저장 대상에 반영)
var people = [];   // {name, mode:'normal'|'star'|'ban', color}
var MAX = 9;

// ---------- 설정 화면 ----------
var nameInput = document.getElementById("nameInput");
var addBtn = document.getElementById("addBtn");
var nameList = document.getElementById("nameList");
var startBtn = document.getElementById("startBtn");

function modeInfo(mode){
  if(mode==="star") return {cls:"on-star", txt:"special"};
  if(mode==="ban")  return {cls:"on-ban",  txt:"exceptional"};
  return {cls:"", txt:"normal"};
}

function renderList(){
  nameList.innerHTML="";
  people.forEach(function(p,i){
    var li=document.createElement("li"); li.className="name-item";

    var dot=document.createElement("span"); dot.className="name-color"; dot.style.background=p.color;
    var txt=document.createElement("span"); txt.className="name-text"; txt.textContent=p.name;

    var tag=document.createElement("button"); tag.className="tag-btn";
    var mi=modeInfo(p.mode); tag.classList.add(mi.cls||"_"); tag.textContent=mi.txt;
    if(!mi.cls) tag.className="tag-btn"; else tag.className="tag-btn "+mi.cls;
    tag.onclick=function(){
      p.mode = p.mode==="normal" ? "star" : (p.mode==="star" ? "ban" : "normal");
      saveDB(); renderList();
    };

    var del=document.createElement("button"); del.className="del-btn"; del.textContent="✕";
    del.onclick=function(){ people.splice(i,1); recolor(); saveDB(); renderList(); };

    li.appendChild(dot); li.appendChild(txt); li.appendChild(tag); li.appendChild(del);
    nameList.appendChild(li);
  });
  startBtn.disabled = people.length===0;
}

function recolor(){ people.forEach(function(p,i){ p.color=PALETTE[i%PALETTE.length]; }); }

function addName(){
  var v=nameInput.value.trim();
  if(!v) return;
  if(people.length>=MAX){ toast("You can add up to "+MAX+" names."); return; }
  people.push({name:v, mode:"normal", color:PALETTE[people.length%PALETTE.length]});
  nameInput.value=""; nameInput.focus(); saveDB(); renderList();
}
addBtn.onclick=addName;
nameInput.addEventListener("keydown",function(e){ if(e.key==="Enter") addName(); });

// ===== 반 고르기 =====
var classChips = document.getElementById("classChips");
savedMsgEl = document.getElementById("savedMsg");
function renderClasses(){
  classChips.innerHTML = "";
  DB.classes.forEach(function(c){
    var b = document.createElement("button");
    b.className = "cls-chip" + (c.id===DB.curId ? " on" : "");
    b.textContent = c.name;
    b.onclick = function(){
      if(DB.curId===c.id) return;
      DB.curId = c.id; saveDB(); renderClasses(); useClass(); renderList();
    };
    classChips.appendChild(b);
  });
}
function useClass(){ people = cls().people; recolor(); }
// 다른 탭/예전에 열어둔 화면이 남아 있어도 항상 저장소의 최신 반 목록을 보여준다
function resyncFromStorage(){
  if(!document.getElementById("game").classList.contains("hidden")) return; // 추첨 중엔 유지
  DB = loadDB();
  if(!DB.curId || !DB.classes.some(function(c){ return c.id===DB.curId; })) DB.curId = DB.classes[0].id;
  renderClasses(); useClass(); renderList();
}
window.addEventListener("pageshow", function(e){ if(e.persisted) resyncFromStorage(); });
document.addEventListener("visibilitychange", function(){ if(document.visibilityState==="visible") resyncFromStorage(); });
window.addEventListener("storage", function(e){ if(e.key===KEY) resyncFromStorage(); });
document.getElementById("newClsBtn").onclick = function(){
  askText("New class name", "", function(n){
    var c = { id:newId(), name:(String(n).trim()||"New class"), people:[] };
    DB.classes.push(c); DB.curId = c.id; saveDB(); renderClasses(); useClass(); renderList();
  });
};
document.getElementById("renameBtn").onclick = function(){
  var c = cls();
  askText("Class name", c.name, function(n){
    c.name = String(n).trim() || c.name; saveDB(); renderClasses();
  });
};
document.getElementById("delClsBtn").onclick = function(){
  if(DB.classes.length<=1){ toast("You need at least one class."); return; }
  var c = cls();
  askConfirm('Delete "'+c.name+'"? Its name list will be deleted too.', function(){
    DB.classes = DB.classes.filter(function(x){ return x.id!==c.id; });
    DB.curId = DB.classes[0].id; saveDB(); renderClasses(); useClass(); renderList();
  });
};

startBtn.onclick=function(){
  audioInit();
  document.getElementById("setup").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");
  initMachine();
};

// ---------- 추첨 화면 ----------
var canvas=document.getElementById("machine");
var ctx=canvas.getContext("2d");
var stage=document.getElementById("stage");
var drawBtn=document.getElementById("drawBtn");
var resetBtn=document.getElementById("resetBtn");
var backBtn=document.getElementById("backBtn");
var winnerBox=document.getElementById("winner");
var winnerName=document.getElementById("winnerName");
var remainEl=document.getElementById("remain");

var balls=[];       // 활성 공 {p, x,y,vx,vy,r}
var cx,cy,R;        // 통 중심/반지름
var dpr=1;
var animId=null;
var drawing=false;
var flyBall=null;   // 날아오는 공
var winners=[];     // 뽑힌 사람 이름들

function resize(){
  dpr=window.devicePixelRatio||1;
  var w=stage.clientWidth, h=stage.clientHeight;
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+"px"; canvas.style.height=h+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=w/2; cy=h/2;
  R=Math.min(w,h)*0.30;
  // 공 크기 갱신
  var br=Math.max(22, Math.min(R*0.18, 46));
  balls.forEach(function(b){ b.r=br; if(flyBall){} });
}
window.addEventListener("resize", function(){ resize(); });

function makeBalls(){
  balls=[];
  var br=Math.max(22, Math.min(R*0.18, 46));
  people.forEach(function(p){
    if(winners.indexOf(p.name)>=0) return; // 이미 뽑힘 → 제외
    var ang=Math.random()*Math.PI*2, dist=Math.random()*(R-br-6);
    balls.push({
      p:p, r:br,
      x:cx+Math.cos(ang)*dist, y:cy+Math.sin(ang)*dist,
      vx:(Math.random()-0.5)*16, vy:(Math.random()-0.5)*16
    });
  });
}

function initMachine(){
  winners=[]; flyBall=null; drawing=false;
  winnerBox.classList.remove("show");
  resize();
  makeBalls();
  updateRemain();
  if(!animId) loop();
}

function updateRemain(){
  var pool=people.filter(function(p){ return p.mode!=="ban" && winners.indexOf(p.name)<0; });
  remainEl.textContent = ""; // 학생수·남은 수 비공개 (숫자 노출 금지)
  drawBtn.disabled = pool.length===0 || drawing;
  drawBtn.textContent = pool.length===0 ? "Done! 🎊" : "PICK 🎯";
}

// 가중 랜덤으로 당첨자 선택 (ban=0, star=가중치↑)
function pickWinner(){
  var pool=people.filter(function(p){ return p.mode!=="ban" && winners.indexOf(p.name)<0; });
  if(pool.length===0) return null;
  var weights=pool.map(function(p){ return p.mode==="star" ? 5 : 1; });
  var total=weights.reduce(function(a,b){return a+b;},0);
  var r=Math.random()*total;
  for(var i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0) return pool[i]; }
  return pool[pool.length-1];
}

drawBtn.onclick=function(){
  if(drawing) return;
  audioInit();
  var win=pickWinner();
  if(!win) return;
  drawing=true; drawBtn.disabled=true; winnerBox.classList.remove("show");
  // 당첨 공 찾기 (없으면 통 안 아무 보통 공이 날아가되 이름은 win)
  var target=null;
  for(var i=0;i<balls.length;i++){ if(balls[i].p.name===win.name){ target=balls[i]; break; } }
  if(!target && balls.length){ target=balls[0]; }
  // 흔들기 단계 → 발사
  shakeFrames=18;
  pendingWinner=win; pendingBall=target;
};

var shakeFrames=0, pendingWinner=null, pendingBall=null, flyT=0;

function launch(){
  var b=pendingBall;
  // 통에서 제거하고 날아오는 공으로 전환
  var idx=balls.indexOf(b);
  if(idx>=0) balls.splice(idx,1);
  flyBall={
    p:pendingWinner, color:pendingWinner.color,
    x:b?b.x:cx, y:b?b.y:cy, r:b?b.r:36,
    sx:b?b.x:cx, sy:b?b.y:cy
  };
  flyT=0;
  pendingBall=null;
  sfxLaunch();
}

function physics(){
  var speed = shakeFrames>0 ? 2.4 : 1.0; // 흔들 때 더 빠르게
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    b.x+=b.vx*speed; b.y+=b.vy*speed;
    // 약한 중심 흔들림
    if(shakeFrames>0){ b.vx+=(Math.random()-0.5)*1.6; b.vy+=(Math.random()-0.5)*1.6; }
    // 원형 벽 충돌
    var dx=b.x-cx, dy=b.y-cy, d=Math.hypot(dx,dy), max=R-b.r-4;
    if(d>max){
      var nx=dx/d, ny=dy/d, dot=b.vx*nx+b.vy*ny;
      b.vx-=2*dot*nx; b.vy-=2*dot*ny;
      b.x=cx+nx*max; b.y=cy+ny*max;
      sfxClick(); // 벽에 부딪히는 소리
    }
    // 속도 제한/감쇠
    var sp=Math.hypot(b.vx,b.vy);
    var lim = shakeFrames>0?26:13;
    if(sp>lim){ b.vx=b.vx/sp*lim; b.vy=b.vy/sp*lim; }
    if(sp<6 && shakeFrames<=0){ var a=Math.random()*Math.PI*2; b.vx+=Math.cos(a)*3; b.vy+=Math.sin(a)*3; }
  }
  // 공끼리 가벼운 분리
  for(var i=0;i<balls.length;i++) for(var j=i+1;j<balls.length;j++){
    var a=balls[i], c=balls[j], ddx=c.x-a.x, ddy=c.y-a.y, dd=Math.hypot(ddx,ddy), min=a.r+c.r;
    if(dd>0 && dd<min){
      var ov=(min-dd)/2, ux=ddx/dd, uy=ddy/dd;
      a.x-=ux*ov; a.y-=uy*ov; c.x+=ux*ov; c.y+=uy*ov;
      var tvx=a.vx; a.vx=c.vx; c.vx=tvx; var tvy=a.vy; a.vy=c.vy; c.vy=tvy;
    }
  }
}

function drawMachine(){
  var w=stage.clientWidth, h=stage.clientHeight;
  ctx.clearRect(0,0,w,h);

  // 통 (유리병)
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2);
  var g=ctx.createRadialGradient(cx-R*0.3,cy-R*0.3,R*0.2,cx,cy,R);
  g.addColorStop(0,"rgba(255,255,255,.9)"); g.addColorStop(1,"rgba(200,225,255,.35)");
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=10; ctx.strokeStyle="#cdd8ff"; ctx.stroke();
  ctx.lineWidth=4; ctx.strokeStyle="#fff"; ctx.stroke();
  // 출구 (위쪽 노즐)
  ctx.fillStyle="#ffb74a";
  ctx.fillRect(cx-26, cy-R-18, 52, 26);
  ctx.beginPath(); ctx.arc(cx, cy-R-18, 26, Math.PI, 0); ctx.fill();
  ctx.restore();

  // 공들
  balls.forEach(function(b){ drawBall(b.x,b.y,b.r,b.p.color,b.p.name); });

  // 날아오는 공
  if(flyBall){ drawBall(flyBall.x,flyBall.y,flyBall.r,flyBall.color,flyBall.p.name); }
}

function drawBall(x,y,r,color,name){
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  var g=ctx.createRadialGradient(x-r*0.35,y-r*0.4,r*0.1,x,y,r);
  g.addColorStop(0,"#ffffff"); g.addColorStop(0.25,color); g.addColorStop(1,shade(color,-25));
  ctx.fillStyle=g; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle="rgba(255,255,255,.6)"; ctx.stroke();
  // 이름
  ctx.fillStyle="#fff"; ctx.font="bold "+Math.max(12,r*0.5)+"px sans-serif";
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.shadowColor="rgba(0,0,0,.35)"; ctx.shadowBlur=3;
  var label=name.length>4?name.slice(0,3)+"…":name;
  ctx.fillText(label, x, y);
  ctx.restore();
}

function shade(hex,amt){
  var c=hex.replace("#",""); var n=parseInt(c,16);
  var r=Math.max(0,Math.min(255,(n>>16)+amt));
  var gg=Math.max(0,Math.min(255,((n>>8)&255)+amt));
  var b=Math.max(0,Math.min(255,(n&255)+amt));
  return "rgb("+r+","+gg+","+b+")";
}

function loop(){
  animId=requestAnimationFrame(loop);

  if(shakeFrames>0){
    physics();
    shakeFrames--;
    if(shakeFrames===0 && pendingWinner){ launch(); }
  } else if(flyBall){
    flyT+=1;
    // 출구로 빠르게 이동 후 화면 중앙 위로 튀어오름
    var exitX=cx, exitY=cy-R-18;
    if(flyT<10){
      flyBall.x += (exitX-flyBall.x)*0.4;
      flyBall.y += (exitY-flyBall.y)*0.4;
      flyBall.r += (Math.min(stage.clientWidth,stage.clientHeight)*0.16 - flyBall.r)*0.25;
    } else {
      // 위로 살짝 떠올랐다가 결과 표시
      flyBall.y += (cy*0.55 - flyBall.y)*0.3;
      flyBall.x += (cx-flyBall.x)*0.3;
      if(flyT>20){ finishDraw(); }
    }
  } else {
    physics();
  }
  drawMachine();
}

function finishDraw(){
  var win=pendingWinner;
  winners.push(win.name);
  flyBall=null; pendingWinner=null; drawing=false;
  winnerName.textContent=win.name;
  winnerBox.classList.add("show");
  sfxWin();
  burst();
  updateRemain();
}

var soundBtn=document.getElementById("soundBtn");
function renderSoundBtn(){ soundBtn.textContent = soundOn ? "🔊 Sound" : "🔇 Muted"; }
function toggleSound(){
  soundOn=!soundOn;
  try{ localStorage.setItem(SOUND_KEY, soundOn?"on":"off"); }catch(e){}
  renderSoundBtn();
  applySound();
}
soundBtn.onclick=toggleSound;
// 일부 태블릿에서 click이 안 잡히는 경우 대비 — touchend로도 처리(중복 방지 위해 기본 click 취소)
soundBtn.addEventListener("touchend",function(e){ e.preventDefault(); toggleSound(); },{passive:false});
renderSoundBtn();

resetBtn.onclick=function(){ initMachine(); };
backBtn.onclick=function(){
  document.getElementById("game").classList.add("hidden");
  document.getElementById("setup").classList.remove("hidden");
  resyncFromStorage();
};

// 컨페티
function burst(){
  for(var i=0;i<40;i++){
    (function(){
      var el=document.createElement("div"); el.className="confetti";
      el.style.left=(50+(Math.random()-0.5)*40)+"%";
      el.style.top="38%";
      el.style.background=PALETTE[Math.floor(Math.random()*PALETTE.length)];
      el.style.borderRadius=Math.random()<0.5?"50%":"2px";
      stage.appendChild(el);
      var ang=Math.random()*Math.PI*2, sp=4+Math.random()*7;
      var vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp-6, x=0,y=0,t=0;
      var iv=setInterval(function(){
        t++; vy+=0.5; x+=vx; y+=vy;
        el.style.transform="translate("+x+"px,"+y+"px) rotate("+(t*20)+"deg)";
        el.style.opacity=Math.max(0,1-t/45);
        if(t>45){ clearInterval(iv); el.remove(); }
      },16);
    })();
  }
}

// ===== 시작 =====
renderClasses();
useClass();
renderList();
</script>
